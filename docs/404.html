<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <title>Page not found | Industrial IoT Portfolio</title>
  <style>
    body { background: #0b1120; color: #f1f5f9; font: 1rem/1.6 system-ui, sans-serif; margin: 0; } main { max-width: 46rem; margin: 12vh auto; padding: 1.5rem; } h1 { font-size: clamp(2.6rem, 8vw, 5rem); line-height: 1; margin: .4em 0; } a, strong { color: #64d9fd; } a:focus-visible { outline: 2px solid currentColor; outline-offset: .25rem; }
    @media (prefers-color-scheme: light) { body { background: #f8fafc; color: #142132; } a, strong { color: #075985; } }
  </style>
</head>
<body>
  <main><strong>404</strong><h1>Page not found.</h1><p>The portfolio is available from its homepage.</p><a id="return-home" href="https://squirrelbd.github.io/helloworld/">Return to the portfolio</a></main>
  <script>
    const projectBase = '/helloworld';
    const atProjectBase = location.pathname === projectBase || location.pathname.startsWith(projectBase + '/');
    document.getElementById('return-home').href = atProjectBase ? projectBase + '/' : '/';
  </script>
</body>
</html>
